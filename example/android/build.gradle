buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "26.1.10909125"
        // Use a Kotlin Gradle plugin version compatible with React Native 0.77's
        // Gradle plugin to avoid "KotlinTopLevelExtension, but class was expected"
        // errors when applying the React Native Gradle plugin. As of RN 0.77,
        // Kotlin 2.0.21 is the latest supported version.
        kotlinVersion = "2.0.21"
        TruVideoReactTurboCameraSdk_kotlinVersion = "2.0.21"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}")
    }
}

apply plugin: "com.facebook.react.rootproject"
